# Configuration for the live demo. Run log-monitor from the repository root:
#
#   java -jar target/log-monitor.jar --config=demo/demo.properties
#
# file.pattern and match.pattern are left at their defaults (*.log and \bERROR\b).

watch.directory=demo/watch
alert.file=demo/alerts.log
state.file=demo/state.properties

# Short interval so the periodic full scan can be shown within the demo.
scan.interval.seconds=10
