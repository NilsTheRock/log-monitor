# Example configuration for log-monitor.
#
#   java -jar target/log-monitor.jar --config=config/log-monitor.example.properties
#
# Every key can also be given on the command line and then wins over this file:
#
#   java -jar target/log-monitor.jar --config=... --scan.interval.seconds=10
#
# Relative paths are resolved against the working directory.

# Directory whose log files are watched. Subdirectories are ignored. Required.
watch.directory=logs

# Glob pattern the file name has to match to be scanned.
file.pattern=*.log

# Regular expression a line has to contain to be reported. Case-sensitive.
# Note: in a properties file a backslash has to be escaped, so the word boundary
# \b of the regular expression is written as \\bERROR\\b here.
match.pattern=\\bERROR\\b

# Interval of the periodic full scan in seconds. It is the safety net for file
# system events that never arrive; single changes are picked up immediately.
scan.interval.seconds=60

# File the findings are appended to, in the same format as the console output.
alert.file=alerts.log

# File the scan progress (byte offset and line count per log file) is stored in.
# Delete it to scan all files from the beginning again.
state.file=.log-monitor-state.properties
